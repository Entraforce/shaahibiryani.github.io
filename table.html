<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Your table · Shaahi Biryani</title>
<!--
  WHERE A TABLE'S QR CODE LANDS.

  The codes on the tables point at https://shaahibiryanidfw.com/table.html?t=7
  rather than straight at the app's shaahibiryaniapp:// scheme. A custom scheme
  does nothing at all on a phone without the app installed — the camera simply
  shrugs — and a guest sitting at a table with a code that does nothing is the
  one outcome worth designing against. An https link always opens, so this page
  can hand the app its table when the app is there, and offer to install it when
  it is not.

  This page does NOT decide whether anyone may order to a table. It only passes
  the number along. Whether the guest is really at the restaurant is checked in
  the app, against the device's location — see lib/dine-in-access.ts in
  shaahi-biryani-app. A page cannot be trusted with that: anyone can type this
  URL.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0A0A0C; color: #F0E6D6;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: .01em; }
  .table { font-size: 2.6rem; font-weight: 800; margin: 2px 0 14px; color: #C9A84C; }
  p { margin: 0 0 18px; line-height: 1.6; color: rgba(240,230,214,.75); font-size: .98rem; }
  a.btn {
    display: block; padding: 15px 20px; border-radius: 12px; text-decoration: none;
    font-weight: 700; margin-bottom: 10px;
  }
  .primary { background: #C9A84C; color: #2A0E0E; }
  .ghost { border: 1px solid rgba(240,230,214,.28); color: #F0E6D6; }
  .small { font-size: .82rem; color: rgba(240,230,214,.5); margin-top: 18px; }
  .bad { color: #F3B9B4; }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="assets/apple-touch-icon.png" alt="Shaahi Biryani" />
    <h1 id="head">Your table</h1>
    <div class="table" id="num"></div>
    <p id="msg">Opening the Shaahi Biryani app so you can order from where you are sitting…</p>
    <a class="btn primary" id="open" href="#">Open the app</a>
    <a class="btn ghost" id="store" href="https://apps.apple.com/app/id6778899583">Get the app</a>
    <a class="btn ghost" href="/#menu">See the menu</a>
    <p class="small">
      Ordering to your table needs the app and only works at the restaurant. You can always
      order at the counter.
    </p>
  </div>

<script>
(function () {
  // Tables 1-14 are the floor plan. Anything else is a mistyped or mischievous
  // link, and is told so plainly rather than sent into the app to fail there.
  var MIN = 1, MAX = 14;
  var raw = new URLSearchParams(location.search).get('t') || '';
  var ok = /^\d{1,2}$/.test(raw.trim());
  var n = ok ? Number(raw.trim()) : NaN;
  var valid = ok && Number.isInteger(n) && n >= MIN && n <= MAX;

  var head = document.getElementById('head');
  var num = document.getElementById('num');
  var msg = document.getElementById('msg');
  var open = document.getElementById('open');

  if (!valid) {
    head.textContent = 'That code is not one of our tables';
    msg.className = 'bad';
    msg.textContent = 'Please scan the code on your own table, or order at the counter.';
    open.style.display = 'none';
    return;
  }

  num.textContent = 'Table ' + n;
  var deep = 'shaahibiryaniapp://table/' + n;
  open.setAttribute('href', deep);

  // Try the app straight away. If it is installed the phone switches to it and
  // this page is left behind; if not, nothing happens and the buttons below are
  // what the guest uses. No redirect timer games — they misfire when the app
  // IS installed and the user comes back.
  try { location.href = deep; } catch (e) { /* buttons still work */ }
})();
</script>
</body>
</html>
